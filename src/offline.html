<!doctype html>
<meta charset="utf-8" />
<title>Bipli</title>
<style>
  :root { color-scheme: light only; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #F7F5F1; color: #131312;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .card { max-width: 30rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 500; margin: 0 0 .6rem; letter-spacing: -0.01em; }
  p { margin: 0 0 1rem; color: #2A2926; }
  button {
    font: inherit; font-weight: 500; cursor: pointer;
    padding: .6rem 1.3rem; border-radius: 10px; border: 0;
    background: #131312; color: #F7F5F1;
  }
  button:disabled { opacity: .5; cursor: default; }
  .detail {
    margin-top: 1.6rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: #6B675F; word-break: break-word;
  }
  .hint { margin-top: .9rem; font-size: 12.5px; color: #6B675F; }
</style>
<div class="card">
  <h1 id="title">Can't reach bipli.com</h1>
  <p id="body">Bipli needs the internet to make and take calls. Check your connection, then try again.</p>
  <p class="hint" id="auto">Reconnecting automatically. This screen goes away on its own when Bipli answers.</p>
  <button id="retry" type="button">Retry now</button>
  <div class="hint">
    Still stuck? Right-click the Bipli icon near the clock and choose
    <strong>Show log</strong>, then send us the file.
  </div>
  <div class="detail" id="detail"></div>
</div>
<script>
  // The reason arrives as a hash so this page needs no preload of its own and
  // no IPC to render: main.js loads it as offline.html#<code>|<description>.
  var raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  // "updating:<status>" = the server answered 5xx (a Republish in progress),
  // not a connection problem: say so, and don't send anyone to check their wifi.
  if (raw.indexOf("updating:") === 0) {
    document.getElementById("title").textContent = "Bipli\u2019s just been updated.";
    document.getElementById("body").textContent = "Reconnecting\u2026 the app reloads itself when the server\u2019s back. Nothing to do.";
    raw = raw.slice("updating:".length);
  }
  if (raw) document.getElementById("detail").textContent = raw;
  var btn = document.getElementById("retry");
  btn.addEventListener("click", function () {
    btn.disabled = true;
    btn.textContent = "Reconnecting…";
    // The shell's preload runs on this page too, so the bridge is the retry
    // path. The href fallback covers a preload that failed to attach — which is
    // exactly the kind of failure that lands someone on this screen.
    try {
      if (window.bipliDesktop && window.bipliDesktop.retryLoad) {
        window.bipliDesktop.retryLoad();
        return;
      }
    } catch (e) {}
    location.href = "https://bipli.com";
  });
</script>
