# =============================================================================
# Build and release Bipli Desktop.
#
# 🔑 CI IS THE MAC. There is no Mac to build on, so macos-latest is not a
# convenience here — it is the only way a signed, notarised DMG can exist at all.
# That makes this workflow load-bearing rather than nice-to-have, and it is why
# the Mac job must fail loudly rather than be skipped when credentials are
# missing on a tagged run.
#
# Triggers:
#   push tag v*  → build both, sign where credentials exist, publish a Release
#   manual       → build both, publish nothing (a dry run that proves it compiles)
# =============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates/updates the GitHub Release

jobs:
  build:
    strategy:
      # ⚠️ fail-fast OFF. One platform failing must not cancel the other — a
      # half-finished release where you cannot see WHICH half failed is worse
      # than two clear results.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
          - os: macos-latest
            script: pack:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # --- macOS notarisation key ------------------------------------------
      # 🔑 electron-builder WANTS A PATH, NOT A KEY. APPLE_API_KEY is read as a
      # filename and handed to notarytool; a secret pasted in as base64 (or as
      # the PEM text itself) makes it try to open that blob as a path. The secret
      # has to become a real file on disk before the build starts.
      #
      # ⚠️ RUNNER_TEMP, NOT THE WORKSPACE. The .p8 is a live Apple credential and
      # the workspace is what upload-artifact publishes.
      - name: Stage App Store Connect API key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_B64:-}" ]; then
            echo "note: APPLE_API_KEY is not set — this build will not be notarised."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # Tolerate either storage form: base64 (what `base64 -w0 key.p8`
          # produces) or the PEM text pasted in whole.
          # ⚠️ openssl, not base64(1). This runs on macOS, whose BSD base64 spells
          # decode -D and does not accept --decode at all.
          if printf '%s' "$APPLE_API_KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_B64" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_B64" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          # Prove it decoded to a key rather than to noise, before the build
          # spends ten minutes getting to notarisation and failing there.
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || {
            echo "::error::APPLE_API_KEY did not decode to a PKCS#8 private key."
            exit 1
          }
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "staged $(wc -c < "$KEY_PATH") byte key at $KEY_PATH"

      - name: Build
        env:
          # electron-builder publishes to the repo this token belongs to.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID — base64 .p12 plus its password.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisation via an App Store Connect API key (no app-specific
          # password, no 2FA prompt in CI).
          # 🔴 APPLE_API_KEY IS DELIBERATELY ABSENT HERE. It read
          # secrets.APPLE_API_KEY_PATH, a secret that does not exist, so it
          # resolved to "" — and an empty env var reads to electron-builder as
          # unset: "Env vars APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER
          # need to be set". The staging step above puts the PATH in GITHUB_ENV;
          # naming it here again would override that with the empty value, since
          # step-level env beats job-level env.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          HAS_MAC_CERT="${{ secrets.MAC_CERT_P12 != '' }}"

          # 🔴 A TAGGED MAC BUILD WITHOUT CREDENTIALS MUST FAIL, NOT SHIP.
          # An unsigned DMG installs and then Gatekeeper refuses to open it — a
          # release that looks successful and is unusable. Better to break the
          # build than to publish that.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "$IS_TAG" = "true" ] && [ "$HAS_MAC_CERT" != "true" ]; then
            echo "::error::Tagged macOS release with no MAC_CERT_P12 — an unsigned DMG is not a release."
            exit 1
          fi

          # 🔴 SIGNED BUT UN-NOTARISED IS ALSO NOT A RELEASE. Gatekeeper refuses
          # it on any Mac that has not seen it before, and the failure looks
          # identical to an unsigned build to the person downloading it. Checked
          # here rather than discovered ten minutes into the build.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "$IS_TAG" = "true" ]; then
            for v in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
              if [ -z "${!v:-}" ]; then
                echo "::error::Tagged macOS release with $v unset — the DMG would be signed but not notarised."
                exit 1
              fi
            done
            [ -f "$APPLE_API_KEY" ] || { echo "::error::APPLE_API_KEY=$APPLE_API_KEY is not a file. electron-builder expects a PATH to the .p8."; exit 1; }
          fi

          # Windows signing is a follow-up (Azure Artifact Signing, applied for
          # as the company). Until then Windows builds are unsigned and
          # SmartScreen will warn — known, accepted, and not a silent state:
          echo "note: Windows artifacts are UNSIGNED until Azure Artifact Signing is approved."

          if [ "$IS_TAG" = "true" ]; then
            npm run release -- --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
          else
            npm run ${{ matrix.script }}
          fi

      # The key is a live credential; the runner is ephemeral but the artifact
      # step is not selective, so remove it explicitly either way.
      - name: Remove staged API key
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: bipli-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn
