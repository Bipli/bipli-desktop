# =============================================================================
# Build and release Bipli Desktop.
#
# 🔑 CI IS THE MAC. There is no Mac to build on, so macos-latest is not a
# convenience here — it is the only way a signed, notarised DMG can exist at all.
# That makes this workflow load-bearing rather than nice-to-have, and it is why
# the Mac job must fail loudly rather than be skipped when credentials are
# missing on a tagged run.
#
# Triggers:
#   push tag v*  → build both, sign where credentials exist, publish a Release
#   manual       → build both, publish nothing (a dry run that proves it compiles)
# =============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates/updates the GitHub Release

jobs:
  # 🔴 THE DRAFT IS CREATED ONCE, HERE, BEFORE ANY BUILD STARTS. v0.1.0 produced
  # TWO draft releases: both platform jobs ran electron-builder --publish always
  # at the same moment, each looked for a release for the tag, each found none,
  # and each created one. Whichever lost the race uploaded into a release nobody
  # publishes. Creating the draft in a job the builds DEPEND ON removes the race
  # entirely rather than narrowing it.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Idempotent: a re-run of a failed workflow must reuse the draft, not
          # add another one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --notes "$(cat <<'NOTES'
          Bipli Desktop.

          macOS: one universal download for both Apple Silicon and Intel Macs.
          Signed with our Apple Developer ID and notarised by Apple.
          NOTES
          )"

  build:
    needs: [draft]
    # The matrix must still run for a manual dry run, when `draft` is skipped.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      # ⚠️ fail-fast OFF. One platform failing must not cancel the other — a
      # half-finished release where you cannot see WHICH half failed is worse
      # than two clear results.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
          - os: macos-latest
            script: pack:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # --- macOS signing keychain ------------------------------------------
      # 🔴 electron-builder's OWN CSC_LINK IMPORT IS THE THING THAT FAILS. It
      # imports the .p12 into a temporary keychain and then runs
      # `security set-key-partition-list`, which on the GitHub runner dies with
      # "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct". The passphrase is fine — the temp keychain is not reliably
      # unlocked at that moment. Doing the import ourselves, with a keychain we
      # create and unlock explicitly, sidesteps it entirely.
      #
      # Done with `security` directly rather than apple-actions/import-codesign-certs:
      # this is the step that handles the signing key, and fifteen lines we can
      # read beat a third-party action in that position. The action remains a
      # drop-in replacement if this ever needs to change.
      - name: Create signing keychain
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12:-}" ]; then
            echo "note: MAC_CERT_P12 is not set — this build will not be signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/bipli-signing.keychain-db"
          # Random, per-run, and never leaves the runner. Masked so it cannot
          # surface in a log line from any later command.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # ⚠️ NO AUTO-LOCK. The default settings re-lock the keychain on a
          # timeout and on sleep; a build that outlives that gets the exact
          # passphrase error we are fixing, only later and less obviously.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$MAC_CERT_P12" | tr -d '[:space:]' | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Authorise codesign to use the key without an interactive prompt.
          # -k takes the KEYCHAIN password, not the .p12 one.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Keep the existing keychains in the search list — dropping them takes
          # the Apple intermediates with them and the chain stops resolving.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
          security default-keychain -s "$KEYCHAIN"

          # Prove the identity is usable now, rather than at codesign time.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in the new keychain — the .p12 imported but is not usable for signing."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # --- macOS notarisation key ------------------------------------------
      # 🔑 electron-builder WANTS A PATH, NOT A KEY. APPLE_API_KEY is read as a
      # filename and handed to notarytool; a secret pasted in as base64 (or as
      # the PEM text itself) makes it try to open that blob as a path. The secret
      # has to become a real file on disk before the build starts.
      #
      # ⚠️ RUNNER_TEMP, NOT THE WORKSPACE. The .p8 is a live Apple credential and
      # the workspace is what upload-artifact publishes.
      - name: Stage App Store Connect API key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_B64:-}" ]; then
            echo "note: APPLE_API_KEY is not set — this build will not be notarised."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # Tolerate either storage form: base64 (what `base64 -w0 key.p8`
          # produces) or the PEM text pasted in whole.
          # ⚠️ openssl, not base64(1). This runs on macOS, whose BSD base64 spells
          # decode -D and does not accept --decode at all.
          if printf '%s' "$APPLE_API_KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_B64" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_B64" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          # Prove it decoded to a key rather than to noise, before the build
          # spends ten minutes getting to notarisation and failing there.
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || {
            echo "::error::APPLE_API_KEY did not decode to a PKCS#8 private key."
            exit 1
          }
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "staged $(wc -c < "$KEY_PATH") byte key at $KEY_PATH"

      - name: Build
        env:
          # electron-builder publishes to the repo this token belongs to.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔴 CSC_LINK AND CSC_KEY_PASSWORD ARE GONE ON PURPOSE. Setting either
          # one makes electron-builder do its own .p12 import into its own temp
          # keychain — which is precisely the import that fails on the runner.
          # The certificate is already in the keychain staged above; auto
          # discovery finds it there. CSC_KEYCHAIN comes from GITHUB_ENV.
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # Notarisation via an App Store Connect API key (no app-specific
          # password, no 2FA prompt in CI).
          # 🔴 APPLE_API_KEY IS DELIBERATELY ABSENT HERE. It read
          # secrets.APPLE_API_KEY_PATH, a secret that does not exist, so it
          # resolved to "" — and an empty env var reads to electron-builder as
          # unset: "Env vars APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER
          # need to be set". The staging step above puts the PATH in GITHUB_ENV;
          # naming it here again would override that with the empty value, since
          # step-level env beats job-level env.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          HAS_MAC_CERT="${{ secrets.MAC_CERT_P12 != '' }}"

          # 🔴 A TAGGED MAC BUILD WITHOUT CREDENTIALS MUST FAIL, NOT SHIP.
          # An unsigned DMG installs and then Gatekeeper refuses to open it — a
          # release that looks successful and is unusable. Better to break the
          # build than to publish that.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "$IS_TAG" = "true" ] && [ "$HAS_MAC_CERT" != "true" ]; then
            echo "::error::Tagged macOS release with no MAC_CERT_P12 — an unsigned DMG is not a release."
            exit 1
          fi

          # 🔴 SIGNED BUT UN-NOTARISED IS ALSO NOT A RELEASE. Gatekeeper refuses
          # it on any Mac that has not seen it before, and the failure looks
          # identical to an unsigned build to the person downloading it. Checked
          # here rather than discovered ten minutes into the build.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "$IS_TAG" = "true" ]; then
            for v in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
              if [ -z "${!v:-}" ]; then
                echo "::error::Tagged macOS release with $v unset — the DMG would be signed but not notarised."
                exit 1
              fi
            done
            [ -f "$APPLE_API_KEY" ] || { echo "::error::APPLE_API_KEY=$APPLE_API_KEY is not a file. electron-builder expects a PATH to the .p8."; exit 1; }
          fi

          # Windows signing is a follow-up (Azure Artifact Signing, applied for
          # as the company). Until then Windows builds are unsigned and
          # SmartScreen will warn — known, accepted, and not a silent state:
          echo "note: Windows artifacts are UNSIGNED until Azure Artifact Signing is approved."

          # 🔴 WINDOWS NEVER PUBLISHES WHILE IT IS UNSIGNED. An unsigned EXE
          # sitting in a public release is one click from a SmartScreen
          # "Windows protected your PC" full-page warning, which on a first
          # download reads as malware. It still BUILDS on every tag — that is
          # how we know it compiles — and lands as a workflow artifact for
          # internal testing, but it is not a release asset until the repo
          # variable WINDOWS_SIGNED is set to true alongside a real certificate.
          WIN_SIGNED="${{ vars.WINDOWS_SIGNED == 'true' }}"
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ "$WIN_SIGNED" != "true" ]; then
            echo "note: Windows is UNSIGNED — building for the artifact only, not publishing to the release."
            npm run pack:win
          elif [ "$IS_TAG" = "true" ]; then
            npm run release -- --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
          else
            npm run ${{ matrix.script }}
          fi

      # The key is a live credential; the runner is ephemeral but the artifact
      # step is not selective, so remove it explicitly either way.
      - name: Remove signing material
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/bipli-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: bipli-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn

  # One release, published once, after both platforms have finished uploading
  # into it. Splitting publish from build is what makes "exactly one release"
  # true even if a platform job is re-run.
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # 🔴 A macOS RELEASE WITHOUT A ZIP CANNOT AUTO-UPDATE. electron-updater
          # asks for a .zip and explicitly excludes dmg and pkg
          # (MacUpdater: findFile(files, "zip", ["pkg", "dmg"])), so a
          # DMG-only release installs fine and then never updates again. Refuse
          # to publish one rather than discover it a version later.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.zip$'   || { echo "::error::No macOS .zip in $TAG — electron-updater cannot update from a DMG-only release."; exit 1; }
          echo "$assets" | grep -q 'latest-mac.yml' || { echo "::error::No latest-mac.yml in $TAG — nothing to update from."; exit 1; }
          gh release edit "$TAG" --draft=false
          echo "published $TAG"
